<title>DataCoaches Hastane Analitiği</title>
<meta name="description" content="Sağlık kuruluşları için veri analitiği ve BI danışmanlığı: başvurudan gerçekleşen randevuya, tedaviden satışa sürecin tamamını görünür kılın.">

<style>
/* Düzen: 1120px tek konteyner; açılış iki kolon, örnek panel tam genişlik yüzey bandında, son çağrı koyu bant. */
:root{
  --bg:#F5F7F5;
  --surface:#FFFFFF;
  --surface-2:#EAEFEC;
  --ink:#13233A;
  --ink-2:#4A5A6A;
  --line:#D5DCD9;
  --line-strong:#AEBBB7;
  --accent:#0B6B6A;
  --accent-strong:#075352;
  --accent-soft:#DCECE9;
  --on-accent:#FFFFFF;
  --track:#E3E9E6;
  --band:#13233A;
  --band-ink:#EAF1F0;
  --band-ink-2:#B3C3C7;
  --band-accent:#86D3C8;
  --on-band-accent:#0E2422;
  --overlay:rgba(12,22,34,.55);
  --shadow:0 1px 2px rgba(19,35,58,.05),0 10px 28px -14px rgba(19,35,58,.22);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --radius:12px;
  --wrap:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161E; --surface:#15202A; --surface-2:#111B24; --ink:#E4EBEE; --ink-2:#A3B2BC;
    --line:#26343F; --line-strong:#3A4B57; --accent:#5DBDB2; --accent-strong:#86D3C8; --accent-soft:#16312F;
    --on-accent:#08201E; --track:#22303B; --band:#0A2A2B; --band-ink:#E6F1EF; --band-ink-2:#A9C2C1;
    --band-accent:#86D3C8; --on-band-accent:#0E2422; --overlay:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161E; --surface:#15202A; --surface-2:#111B24; --ink:#E4EBEE; --ink-2:#A3B2BC;
  --line:#26343F; --line-strong:#3A4B57; --accent:#5DBDB2; --accent-strong:#86D3C8; --accent-soft:#16312F;
  --on-accent:#08201E; --track:#22303B; --band:#0A2A2B; --band-ink:#E6F1EF; --band-ink-2:#A9C2C1;
  --band-accent:#86D3C8; --on-band-accent:#0E2422; --overlay:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
ul,ol{margin:0;padding:0;list-style:none}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:.86em}
.muted{color:var(--ink-2)}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
section[id]{scroll-margin-top:84px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:.65em 1.15em;border-radius:8px;font:600 1rem/1.2 var(--f-body);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background-color .15s,border-color .15s,color .15s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-band{background:var(--band-accent);color:var(--on-band-accent)}
.btn-band:hover{filter:brightness(1.06)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .9rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* Üst menü */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.logo{font-family:var(--f-display);font-size:1.32rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo-a{font-weight:700}
.logo-b{font-weight:500;color:var(--accent)}
.site-nav ul{display:flex;gap:4px;align-items:center}
.site-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.97rem;border-radius:6px}
.site-nav a:hover{background:var(--surface-2)}
.site-nav a.nav-cta{border:1px solid var(--accent);color:var(--accent);margin-left:6px}
.site-nav a.nav-cta:hover{background:var(--accent);color:var(--on-accent)}
.menu-btn{display:none;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .95rem var(--f-body);cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:inline-flex;align-items:center}
  .site-nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .site-nav.is-open{display:block}
  .site-nav ul{flex-direction:column;align-items:stretch;padding:8px 20px 16px;gap:2px}
  .site-nav a{width:100%;padding:0 8px}
  .site-nav a.nav-cta{margin:8px 0 0;justify-content:center}
}

/* Açılış */
.hero{padding-block:64px 72px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:56px;align-items:center}
.eyebrow{display:inline-block;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.5rem);font-weight:650;letter-spacing:-.025em}
.hero-lead{margin-top:20px;font-size:1.15rem;color:var(--ink-2);max-width:56ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;margin:0}
.mini-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mini-title{font:600 .95rem var(--f-body)}
.demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:999px;padding:3px 10px}
.mini-kpi{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.mini-kpi strong{font-family:var(--f-display);font-size:2.3rem;font-weight:650;letter-spacing:-.02em;color:var(--accent)}
.mini-kpi span{color:var(--ink-2);font-size:.95rem}
.mini-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink-2)}
.mini-views{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mini-views span{font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
@media (max-width:960px){.hero-grid{grid-template-columns:1fr;gap:40px}.hero{padding-block:44px 56px}}

/* Huni */
.funnel{display:grid;gap:14px}
.f-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.f-label{font-weight:600}
.f-num{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:1.02rem}
.f-track{height:14px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
.f-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.f-meta{margin-top:5px;font-size:.88rem;color:var(--ink-2)}
.f-meta strong{color:var(--ink);font-weight:700}
.f-loss{font-size:.86rem;color:var(--ink-2);margin:-4px 0 8px;padding-left:2px}
.f-loss b{font-family:var(--f-data);font-weight:500;color:var(--ink)}
.f-loss.neutral{font-style:italic}
.funnel-compact{gap:10px}
.funnel-compact .f-track{height:10px;margin-top:4px}
.funnel-compact .f-label{font-size:.93rem}
.funnel-compact .f-num{font-size:.95rem}
.f-rate{font-family:var(--f-data);font-size:.8rem;color:var(--ink-2);margin-left:8px;font-weight:500}

/* Bölüm başlıkları */
.section{padding-block:80px}
.section-head{max-width:720px;margin-bottom:40px}
.section-head h2{font-size:clamp(1.7rem,3vw,2.35rem);font-weight:650}
.section-head p{margin-top:14px;color:var(--ink-2);font-size:1.08rem}
.h2-plain{font-size:clamp(1.7rem,3vw,2.35rem);font-weight:650}
@media (max-width:640px){.section{padding-block:56px}}

/* Sorular */
.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 44px}
.question{border-top:2px solid var(--ink);padding-top:18px;min-width:0}
.q-tag{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.question h3{font-size:1.28rem;font-weight:600;margin-top:8px}
.question p{margin-top:8px;color:var(--ink-2);font-size:.98rem}
@media (max-width:960px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.questions{grid-template-columns:1fr;gap:30px}}

/* Panel bandı */
.panel-band{background:var(--surface-2);border-block:1px solid var(--line)}
.panel-labels{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:18px}
.panel-labels .demo-chip{background:var(--surface)}
.panel-labels p{font-size:.92rem;color:var(--ink-2);max-width:62ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
/* Rapor seçici: numaralı kartlar */
.report-nav{padding:18px 22px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);scroll-margin-top:80px}
.report-nav-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.report-nav-head strong{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.report-nav-head span{font-size:.88rem;color:var(--ink-2)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left;padding:12px 14px 13px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--f-body);transition:border-color .15s,background-color .15s,transform .15s;touch-action:manipulation}
.tab:hover{border-color:var(--accent);transform:translateY(-1px)}
.tab-num{font-family:var(--f-data);font-size:.72rem;color:var(--accent)}
.tab-title{font-weight:700;font-size:1.02rem;line-height:1.25}
.tab-sub{font-size:.8rem;line-height:1.3;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px -12px var(--accent)}
.tab[aria-selected="true"]:hover{transform:none}
.tab[aria-selected="true"] .tab-num,.tab[aria-selected="true"] .tab-sub{color:var(--on-accent);opacity:.9}
@media (max-width:980px){
  .tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .tab{scroll-snap-align:start}
  .report-nav-head span::after{content:" Diğerleri için yana kaydırın."}
}
/* Filtreler: kompakt */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding:12px 22px;border-bottom:1px solid var(--line)}
.fgroup{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg-btn{min-height:32px;padding:0 10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;font:600 .84rem var(--f-body);cursor:pointer;touch-action:manipulation}
.seg-btn:hover{border-color:var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg-btn[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.btn-sm{min-height:38px;padding:.45em .9em;font-size:.92rem}
.report-next{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:.9rem}
.panel-notes{margin:26px -22px -26px;padding:20px 22px 22px;background:var(--surface-2);border-top:1px solid var(--line);font-size:.92rem}
.panel-notes h3{font-family:var(--f-body);font-size:.98rem;font-weight:700;margin-bottom:8px}
.panel-notes ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 32px}
.panel-notes li{position:relative;padding-left:16px;color:var(--ink-2);min-width:0}
.panel-notes li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.panel-notes .inv{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink);font-size:.88rem;max-width:110ch}
@media (max-width:760px){.panel-notes ul{grid-template-columns:1fr}}
.tabpanel{padding:24px 22px 26px}
.tab-intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 28px;margin-bottom:18px;align-items:flex-end}
.tab-intro .q{font-family:var(--f-display);font-size:1.3rem;font-weight:600;max-width:40ch}
.sources-line{font-size:.85rem;color:var(--ink-2);margin-top:6px}
.showing{font-size:.9rem;color:var(--ink-2)}
.showing b{color:var(--ink);font-weight:600}
.flow-grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.flow-grid.even{grid-template-columns:1fr}}
.in-filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding:10px 14px;margin-bottom:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.rule-text{font-size:.88rem;color:var(--ink-2);max-width:48ch;align-self:center}
.rule-text b{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi-label{font-size:.84rem;color:var(--ink-2);line-height:1.3;min-height:2.6em}
.kpi-value{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-sub{font-size:.78rem;color:var(--ink-2);margin-top:2px}
.kpi.emph{background:var(--accent-soft)}
.kpi.emph .kpi-value{color:var(--accent)}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3n){border-right:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .kpi:nth-child(3n){border-right:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .kpi-value{font-size:1.38rem}
}

.flow-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;margin-top:26px;align-items:start}
.block-title{font-family:var(--f-body);font-size:1.06rem;font-weight:700;margin-bottom:14px}
.subsection{margin-top:34px}
.subsection > p.table-note{margin-top:-6px}
.assume{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:.92rem}
.assume h3{font-family:var(--f-body);font-size:.98rem;font-weight:700;margin-bottom:8px}
.assume li{position:relative;padding-left:16px;color:var(--ink-2);margin-top:6px}
.assume li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.assume .inv{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink);font-size:.88rem}
@media (max-width:860px){.flow-grid{grid-template-columns:1fr}}

/* Bar listesi */
.barlist{display:grid;gap:12px}
.barlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.barlist .bl-label{font-weight:600}
.barlist .bl-val{font-family:var(--f-data);font-size:.9rem;font-variant-numeric:tabular-nums;text-align:right}
.barlist .bl-track{grid-column:1 / -1;height:10px;background:var(--track);border-radius:4px;overflow:hidden}
.barlist .bl-track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.barlist .bl-sub{grid-column:1 / -1;font-size:.82rem;color:var(--ink-2)}

/* Tablolar */
.table-note{font-size:.9rem;color:var(--ink-2);margin-bottom:12px}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.scroll-hint{display:none;font-size:.82rem;color:var(--ink-2);margin-top:8px}
@media (max-width:760px){.scroll-hint{display:block}}
table.cmp{width:100%;border-collapse:collapse;font-size:.95rem}
.cmp th,.cmp td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);vertical-align:bottom}
.cmp thead th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--f-data);font-size:.72rem;margin-top:3px}
.cmp tbody th{font-weight:600;color:var(--ink)}
.cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
.cmp tr.total th,.cmp tr.total td{background:var(--surface-2)}
.cmp tr.is-selected th,.cmp tr.is-selected td{background:var(--accent-soft)}
.cmp .pct{font-weight:700;font-variant-numeric:tabular-nums}
.cmp .num{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:.9rem}
.cmp .frac{display:block;font-family:var(--f-data);font-size:.74rem;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;font-weight:400}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

function splitInt(total, weights) {
  const sw = weights.reduce((a, b) => a + b, 0);
  const raw = weights.map(w => (total * w) / sw);
  const fl = raw.map(Math.floor);
  const rem = total - fl.reduce((a, b) => a + b, 0);
  const order = raw.map((x, i) => [x - fl[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; k < rem; k++) fl[order[k][1]]++;

}
// Toplamı ağırlıklara göre böler; hiçbir parça kendi üst sınırını (bir önceki adımın sayısını) aşmaz.
function splitCapped(total, weights, caps) {
  const n = caps.length, out = new Array(n).fill(0);
  let rem = Math.min(total, caps.reduce((a, b) => a + b, 0));
  let guard = 0;
  while (rem > 0 && guard++ < 1000) {
    const act = [];
    for (let i = 0; i < n; i++) if (out[i] < caps[i]) act.push(i);
    if (!act.length) break;
    const swW = act.reduce((a, i) => a + Math.max(0, weights[i]), 0);
    const wt = i => (swW > 0 ? Math.max(0, weights[i]) : caps[i] - out[i]);
    const sw = act.reduce((a, i) => a + wt(i), 0);
    let given = 0;
    for (const i of act) { const add = Math.min(Math.floor((rem * wt(i)) / sw), caps[i] - out[i]); out[i] += add; given += add; }
    if (given === 0) {
      const order = act.slice().sort((a, b) => wt(b) - wt(a) || a - b);
      for (const i of order) { if (given >= rem) break; if (out[i] < caps[i]) { out[i]++; given++; } }
    }
    rem -= given;
  }
  return out;
}

function generateMecra(talep) {

    const sm = P_SPM[s.id];

function agg(name, f, pred) {
  const d = DATASETS[name];
  const t = { n: 0 };
  for (const k of d.fields) t[k] = 0;
  for (const r of d.rows) {
    let hit = true;
    for (const fk in d.keys) { const v = f[fk]; if (v !== undefined && v !== "all" && r[d.keys[fk]] !== v) { hit = false; break; } }
    if (!hit || (pred && !pred(r))) continue;
    t.n++;
    for (const k of d.fields) { const v = r[k]; t[k] += ok(v) && v >= 0 ? v : 0; } // eksik veri = 0
  }
  return Object.assign(t, d.derive(t));
}

        ${tr && !compact ? html`<div className=${"f-loss" + (tr.neutral ? " neutral" : "")}><span aria-hidden="true">↳ </span><b>${fmtInt(loss)}</b> ${tr.lossLabel}${tr.lossNote ? ` (${tr.lossNote})` : ""}</div>` : null}
        <div className="f-head">
          <span className="f-label">${label}${compact && tr ? html`<span className="f-rate">${fmtPct(rate)}</span>` : null}</span>
          <span className="f-num">${fmtInt(v)}</span>
        </div>
        <div className="f-track" aria-hidden="true"><div className="f-bar" style=${{ width: w + "%" }}></div></div>
        ${compact ? null : html`<div className="f-meta">${i === 0
          ? def.firstNote + " (%100)"
          : html`${tr.rateLabel}: <strong>${fmtPct(rate)}</strong> <span className="mono">(${fmtInt(v)} / ${fmtInt(m[tr.from])})</span>`}</div>`}
      </li>`;
    })}
  </ol>`;
}

function CompareTable({ label, head, rows, minWidth }) {

          ${rows.map(r => html`<tr key=${r.id} className=${(r.total ? "total" : "") + (r.selected ? " is-selected" : "")}>
            <th scope="row">${r.label}${r.selected ? html`<span className="sel-chip">Seçili</span>` : null}${r.sub ? html`<span className="frac">${r.sub}</span>` : null}</th>
            ${r.cells.map((c, i) => html`<td key=${i}>

}

const rateCell = (m, num, den, key) => ({ main: fmtPct(m[key]), sub: fmtInt(m[num]) + " / " + fmtInt(m[den]) });
const numCell = v => ({ main: fmtInt(v), num: true });
const Empty = () => html`<p className="muted">Bu seçim için kayıt bulunmuyor.</p>`;

function TabIntro({ q, sources, f, extra, third }) {
  return html`<div className="tab-intro">

}

/* --- Rapor 1: Talepten randevuya --- */
function TabTalep({ f, set }) {
  const def = FUNNELS.talep;
  const m = agg("talep", f);
  const bmax = Math.max(0, ...[m.rb1, m.rb2, m.rb3].map(x => x || 0));
  const bscale = scaleTop(bmax);
  const brRows = DIM.branches.map(b => ({ id: b.id, label: b.label, selected: f.branch === b.id, m: agg("talep", Object.assign({}, f, { branch: b.id })) }))
    .concat([{ id: "all", label: "Tüm şubeler", total: true, m: agg("talep", Object.assign({}, f, { branch: "all" })) }]);
  const cscale = scaleTop(Math.max(0, ...brRows.map(r => r.m.rToplam || 0)));
  return html`<div>
    <${TabIntro} q="Başvuruların kaçı gerçekleşen randevuya dönüşüyor, kayıp nerede?" sources="CRM, çağrı merkezi, web formları, randevu sistemi" f=${f} extra=${labelOf(ALL_CH, f.channel)} />
    <div className="in-filters"><${FilterGroup} id="flt-kanal" label="Başvuru kanalı" options=${ALL_CH} value=${f.channel} onChange=${set("channel")} /></div>
    <${Kpis} items=${[
      { label: "Toplam başvuru", value: fmtInt(m.basvuru) },
      { label: "Ulaşılan başvuru", value: fmtInt(m.ulasilan), sub: fmtPct(m.rUlasma) + " ulaşılma" },
      { label: "Oluşturulan randevu", value: fmtInt(m.randevu) },
      { label: "Gerçekleşen randevu", value: fmtInt(m.gerceklesen) },
      { label: "Başvurudan gerçekleşen randevuya", value: fmtPct(m.rToplam), sub: fmtInt(m.gerceklesen) + " / " + fmtInt(m.basvuru), emph: true },
      { label: "Ulaşılamayan başvuru", value: fmtInt(m.ulasilamayan), sub: "Başvurulara oranı " + fmtPct(ratio(m.ulasilamayan, m.basvuru)) }
    ]} />
    <div className="flow-grid">
      <div>
        <h3 className="block-title">Başvuru → Ulaşıldı → Randevu oluşturuldu → Randevu gerçekleşti</h3>
        ${m.basvuru > 0 ? html`<${Funnel} m=${m} def=${def} />` : html`<${Empty} />`}
      </div>
      <${BarList} title="İlk geri dönüş süresine göre randevu oluşturma"
        note="Ulaşılan başvurular, ilk başarılı temasın başvurudan ne kadar sonra kurulduğuna göre ayrılır."
        items=${DIM.buckets.map(b => {
          const u = m["u" + b.id], r = m["r" + b.id], rr = ratio(r, u);
          return { id: "b" + b.id, label: b.label, value: fmtPct(rr), width: rr === null ? 0 : rr / bscale, sub: fmtInt(r) + " randevu / " + fmtInt(u) + " ulaşılan başvuru" };
        })} />
    </div>
    <div className="subsection">
      <h3 className="block-title">Şube karşılaştırması</h3>
      <p className="table-note">Dönem, branş ve kanal filtreleri uygulanır; şube filtresi seçili satırı işaretler.</p>
      <${CompareTable} label="Şube karşılaştırması" minWidth=${720}
        head=${[{ label: "Şube" }, { label: "Başvuru" }].concat(def.transitions.map(t => ({ label: t.rateLabel, sub: t.formula }))).concat([{ label: "Başvurudan gerçekleşen randevuya", sub: "Gerçekleşen / Başvuru" }])}
        rows=${brRows.map(r => ({ id: r.id, label: r.label, selected: r.selected, total: r.total,
          cells: [numCell(r.m.basvuru)].concat(def.transitions.map(t => rateCell(r.m, t.to, t.from, t.rateKey)))
            .concat([{ main: fmtPct(r.m.rToplam), sub: fmtInt(r.m.gerceklesen) + " / " + fmtInt(r.m.basvuru), bar: (r.m.rToplam || 0) / cscale }]) }))} />
    </div>
  </div>`;
}

/* --- Rapor 2: Mecra ve reklam performansı --- */
function TabMecra({ f }) {
  const all = agg("mecra", f);
  const paid = agg("mecra", f, r => PAID.has(r.src));
  const und = agg("mecra", Object.assign({}, f, { source: "tanimsiz" }));
  const rows = DIM.sources.map(s => ({ s, m: agg("mecra", Object.assign({}, f, { source: s.id })) }));
  const paidRows = rows.filter(r => r.s.paid);
  const maxCost = Math.max(0, ...paidRows.map(r => r.m.cpGerc || 0));
  const sc = scaleTop(Math.max(0, ...rows.map(r => r.m.rToplam || 0)));
  const row = (id, label, m, opts) => {
    const o = opts || {};
    const unit = v => (o.noUnit ? { main: "—", sub: "Ücretli satıra bakın" } : { main: fmtTry(v), num: true });
    return { id, label, total: o.total, cells: [
      m.harcama > 0 ? { main: fmtTry(m.harcama), num: true } : { main: "—", sub: "Harcama yok" },
      numCell(m.basvuru),
      m.harcama > 0 ? unit(m.cpl) : { main: "—" },
      numCell(m.randevu),
      m.harcama > 0 ? unit(m.cpRandevu) : { main: "—" },
      numCell(m.gerceklesen),
      m.harcama > 0 ? unit(m.cpGerc) : { main: "—" },
      { main: fmtPct(m.rToplam), sub: fmtInt(m.gerceklesen) + " / " + fmtInt(m.basvuru), bar: (m.rToplam || 0) / sc }] };
  };
  return html`<div>
    <${TabIntro} q="Hangi mecraya yapılan yatırım gerçekleşen randevuya dönüşüyor?" sources="Google Ads, Meta, GA4, CRM, randevu sistemi" f=${f} />
    <${Kpis} items=${[
      { label: "Reklam harcaması", value: fmtTry(paid.harcama) },
      { label: "Ücretli kaynaklardan başvuru", value: fmtInt(paid.basvuru), sub: fmtPct(ratio(paid.basvuru, all.basvuru)) + " tüm başvuruların" },
      { label: "Başvuru başına maliyet (CPL)", value: fmtTry(paid.cpl) },
      { label: "Oluşturulan randevu başına maliyet", value: fmtTry(paid.cpRandevu) },
      { label: "Gerçekleşen randevu başına maliyet", value: fmtTry(paid.cpGerc), sub: fmtInt(paid.gerceklesen) + " gerçekleşen randevu", emph: true },
      { label: "Kaynak bilgisi olmayan başvuru", value: fmtInt(und.basvuru), sub: fmtPct(ratio(und.basvuru, all.basvuru)) + " tüm başvuruların" }
    ]} />
    ${all.basvuru > 0 ? html`<div className="flow-grid even">
      <${BarList} title="Gerçekleşen randevu başına maliyet"
        note="Yalnızca ücretli kaynaklar. Kısa çubuk daha düşük maliyet demektir; başvuru maliyeti ile gerçekleşen randevu maliyetinin sıralaması farklı olabilir."
        items=${paidRows.map(r => ({ id: r.s.id, label: r.s.label, value: fmtTry(r.m.cpGerc), width: maxCost > 0 && r.m.cpGerc !== null ? r.m.cpGerc / maxCost : 0,
          sub: "CPL " + fmtTry(r.m.cpl) + " · başvurudan gerçekleşene " + fmtPct(r.m.rToplam) }))} />
      <${BarList} title="Başvuruların kaynağa göre dağılımı"
        note="Tüm başvurular; ücretli, organik ve kaynağı bilinmeyenler birlikte."
        items=${rows.map(r => { const sh = ratio(r.m.basvuru, all.basvuru); return { id: r.s.id, label: r.s.label, value: fmtPct(sh), width: sh || 0,
          sub: fmtInt(r.m.basvuru) + " başvuru · " + fmtInt(r.m.gerceklesen) + " gerçekleşen randevu" }; })} />
    </div>` : html`<div style=${{ marginTop: "22px" }}><${Empty} /></div>`}
    <div className="subsection">
      <h3 className="block-title">Kaynak karşılaştırması</h3>
      <p className="table-note">Dönem, şube ve branş filtreleri uygulanır. Tutarlar kurgusaldır (TL).</p>
      <${CompareTable} label="Mecra ve kaynak karşılaştırması" minWidth=${1000}
        head=${[{ label: "Kaynak" }, { label: "Harcama" }, { label: "Başvuru" }, { label: "CPL", sub: "Harcama / Başvuru" }, { label: "Randevu" },
          { label: "Randevu başına", sub: "Harcama / Randevu" }, { label: "Gerçekleşen" }, { label: "Gerçekleşen başına", sub: "Harcama / Gerçekleşen" },
          { label: "Başvurudan gerçekleşene", sub: "Gerçekleşen / Başvuru" }]}
        rows=${rows.map(r => row(r.s.id, r.s.label, r.m))
          .concat([row("paid", "Ücretli kaynaklar", paid, { total: true }), row("all", "Tüm kaynaklar", all, { total: true, noUnit: true })])} />
    </div>
  </div>`;
}

/* --- Rapor 3: Randevudan tedaviye --- */

    <${Kpis} items=${[
      { label: "İlk muayene", value: fmtInt(m.muayene), sub: fmtPct(m.rFromTalep) + " başvuru takibinden" },
      { label: "Tedavi veya işlem önerilen", value: fmtInt(m.oneri), sub: fmtPct(m.rOneri) + " muayenelerin" },
      { label: "Tarihi planlanan", value: fmtInt(m.planlandi) },
      { label: "Gerçekleşen tedavi veya işlem", value: fmtInt(m.gerceklesti) },
      { label: "Öneriden gerçekleşmeye", value: fmtPct(m.rOneriGercek), sub: fmtInt(m.gerceklesti) + " / " + fmtInt(m.oneri), emph: true },
      { label: "Kontrol randevusu uyumu", value: fmtPct(m.rKontrol), sub: fmtInt(m.kontrolGerceklesen) + " / " + fmtInt(m.kontrolOnerilen) }
    ]} />
    <div className="flow-grid">
      <div>
        <h3 className="block-title">İlk muayene → Öneri → Planlama → Gerçekleşme</h3>
        ${m.muayene > 0 ? html`<${Funnel} m=${m} def=${def} />` : html`<${Empty} />`}
      </div>
      <${BarList} title="Kontrol randevusu uyumu, şubelere göre"
        note="Önerilen kontrol randevularının gerçekleşme oranı. Dönem ve branş filtreleri uygulanır."
        items=${brK.map(x => ({ id: x.b.id, label: x.b.label, selected: f.branch === x.b.id, value: fmtPct(x.m.rKontrol), width: x.m.rKontrol || 0,
          sub: fmtInt(x.m.kontrolGerceklesen) + " / " + fmtInt(x.m.kontrolOnerilen) + " önerilen kontrol" }))} />
    </div>
    <div className="subsection">
      <h3 className="block-title">Branş karşılaştırması</h3>
      <p className="table-note">Dönem ve şube filtreleri uygulanır; branş filtresi seçili satırı işaretler.</p>
      <${CompareTable} label="Branş karşılaştırması, tedavi takibi" minWidth=${760}
        head=${[{ label: "Branş" }, { label: "İlk muayene" }, { label: "Öneri oranı", sub: "Önerilen / Muayene" }, { label: "Planlama oranı", sub: "Planlanan / Önerilen" },
          { label: "Gerçekleşme oranı", sub: "Gerçekleşen / Planlanan" }, { label: "Öneriden gerçekleşmeye", sub: "Gerçekleşen / Önerilen" }, { label: "Kontrol uyumu", sub: "Gerçekleşen / Önerilen kontrol" }]}
        rows=${rows.map(r => ({ id: r.id, label: r.label, selected: r.selected, total: r.total, cells: [
          numCell(r.m.muayene), rateCell(r.m, "oneri", "muayene", "rOneri"), rateCell(r.m, "planlandi", "oneri", "rPlan"),
          rateCell(r.m, "gerceklesti", "planlandi", "rGercek"),
          { main: fmtPct(r.m.rOneriGercek), sub: fmtInt(r.m.gerceklesti) + " / " + fmtInt(r.m.oneri), bar: (r.m.rOneriGercek || 0) / sc },
          rateCell(r.m, "kontrolGerceklesen", "kontrolOnerilen", "rKontrol")] }))} />
    </div>
  </div>`;
}

/* --- Rapor 4: Erişim ve kapasite --- */

      <${BarList} title="Son dakika boşalan slotların yeniden doldurulması"
        items=${brR.map(x => ({ id: x.b.id, label: x.b.label, selected: f.branch === x.b.id, value: fmtPct(x.m.rRefill), width: x.m.rRefill || 0,

/* --- Rapor 5: Satış ve prim (uluslararası hasta ekibi örneği) --- */
function TabSatis({ f, set, prim, setPrim }) {
  const def = FUNNELS.satis;
  const m = agg("satis", f);
  const total = primCalc(m, prim.rate, prim.stage);
  const stageLabel = labelOf(PRIM_STAGES, prim.stage);
  const specRows = DIM.treatments.map(s => ({ s, m: agg("satis", Object.assign({}, f, { treatment: s.id })) }))
    .sort((a, b) => b.m.satis - a.m.satis || b.m.satisTutar - a.m.satisTutar);
  const maxSat = Math.max(1, ...specRows.map(r => r.m.satis));
  const reps = DIM.reps.filter(r => f.market === "all" || r.market === f.market).map(r => {
    const rm = agg("satis", Object.assign({}, f, { rep: r.id }));
    return { r, m: rm, p: primCalc(rm, prim.rate, prim.stage), top: topSpecialty(Object.assign({}, f, { rep: r.id })) };
  });
  const teamTop = topSpecialty(f);
  return html`<div>
    <${TabIntro} q="Uluslararası hasta ekibinde teklif, satış, depozito ve ödeme nerede?" sources="CRM, teklif kayıtları, finans ve tahsilat" f=${f} third=${labelOf(ALL_TR, f.treatment)} extra=${labelOf(ALL_MK, f.market)} />
    <div className="in-filters">
      <${FilterGroup} id="flt-pazar" label="Pazar" options=${ALL_MK} value=${f.market} onChange=${set("market")} />
      <${FilterGroup} id="flt-prim-oran" label="Örnek prim oranı" options=${PRIM_RATES} value=${prim.rate} onChange=${v => setPrim(Object.assign({}, prim, { rate: v }))} />
      <${FilterGroup} id="flt-prim-asama" label="Prime esas aşama" options=${PRIM_STAGES} value=${prim.stage} onChange=${v => setPrim(Object.assign({}, prim, { stage: v }))} />
      <p className="rule-text"><b>Örnek kural:</b> Prim = “${stageLabel}” aşamasındaki satışların tutarı × ${labelOf(PRIM_RATES, prim.rate)}. Kurumun hedef, kademe, iptal ve iade kurallarıyla değiştirilir.</p>
    </div>
    <${Kpis} items=${[
      { label: "Gönderilen teklif", value: fmtInt(m.teklif) },
      { label: "Satış (teklif kabul)", value: fmtInt(m.satis), sub: fmtPct(m.rKabul) + " kabul" },
      { label: "Depozito alınan", value: fmtInt(m.depozito), sub: fmtPct(m.rDep) + " satışların" },
      { label: "Ödemesi tamamlanan", value: fmtInt(m.odeme), sub: fmtPct(m.rTamam) + " satışların" },
      { label: "Ödemesi tamamlanan tutar", value: fmtEur(m.odeTutar), sub: "Bekleyen " + fmtEur(m.bekleyenTutar), emph: true },
      { label: "Örnek prim toplamı", value: fmtEur(total.prim), sub: "Esas " + fmtEur(total.base) }
    ]} />
    <div className="flow-grid">
      <div>
        <h3 className="block-title">Teklif → Satış → Depozito → Ödeme</h3>
        ${m.teklif > 0 ? html`<${Funnel} m=${m} def=${def} />` : html`<${Empty} />`}
      </div>
      <${BarList} title="Tedavi grubuna göre satış"
        items=${specRows.map(r => ({ id: r.s.id, label: r.s.label, selected: f.treatment === r.s.id, value: fmtInt(r.m.satis) + " satış", width: r.m.satis / maxSat,
          sub: "Satış tutarı " + fmtEur(r.m.satisTutar) + " · ödemesi tamamlanan " + fmtEur(r.m.odeTutar) }))} />
    </div>
    <div className="subsection">
      <h3 className="block-title">Temsilci performansı ve örnek prim</h3>
      <p className="table-note">Dönem, şube, tedavi grubu ve pazar filtreleri uygulanır. Oranlar satış adedine göre hesaplanır. Tutarlar kurgusaldır (EUR).</p>
      <${CompareTable} label="Temsilci performansı ve örnek prim" minWidth=${940}
        head=${[{ label: "Temsilci" }, { label: "Teklif" }, { label: "Satış", sub: "Satış / Teklif" }, { label: "Depozito alındı", sub: "Depozito / Satış" },
          { label: "Ödeme tamamlandı", sub: "Ödeme / Satış" }, { label: "Tamamlanan tutar" }, { label: "Örnek prim", sub: "Esas: " + stageLabel }, { label: "En çok satılan" }]}
        rows=${reps.map(x => ({ id: x.r.id, label: x.r.label, sub: labelOf(DIM.markets, x.r.market), cells: [
          numCell(x.m.teklif),
          { main: fmtInt(x.m.satis), sub: fmtPct(x.m.rKabul) },
          { main: fmtInt(x.m.depozito), sub: fmtPct(x.m.rDep) },
          { main: fmtInt(x.m.odeme), sub: fmtPct(x.m.rTamam) },
          { main: fmtEur(x.m.odeTutar), num: true },
          { main: fmtEur(x.p.prim), sub: "Esas " + fmtEur(x.p.base) },
          { main: x.top ? x.top.s.label : "—", sub: x.top ? fmtInt(x.top.m.satis) + " satış" : "" }] }))
          .concat([{ id: "team", label: "Seçili ekip toplamı", total: true, cells: [
            numCell(m.teklif), { main: fmtInt(m.satis), sub: fmtPct(m.rKabul) }, { main: fmtInt(m.depozito), sub: fmtPct(m.rDep) },
            { main: fmtInt(m.odeme), sub: fmtPct(m.rTamam) }, { main: fmtEur(m.odeTutar), num: true },
            { main: fmtEur(total.prim), sub: "Esas " + fmtEur(total.base) },
            { main: teamTop ? teamTop.s.label : "—", sub: teamTop ? fmtInt(teamTop.m.satis) + " satış" : "" }] }])} />
    </div>
  </div>`;
}

function Panel() {
  const [f, setF] = useState(DEFAULT_FILTER);
  const [tab, setTab] = useState("talep");
  const [prim, setPrim] = useState({ rate: "0.02", stage: "odeme" });
  const tabRefs = useRef({});
  const navRef = useRef(null);
  const set = k => v => setF(prev => Object.assign({}, prev, { [k]: v }));
  const idx = PANEL_TABS.findIndex(t => t.id === tab);
  const next = PANEL_TABS[(idx + 1) % PANEL_TABS.length];

  useEffect(() => { // seçili kartı yatay şeritte görünür tut (mobil)
    const el = tabRefs.current[tab];
    if (el && el.parentElement && el.parentElement.scrollWidth > el.parentElement.clientWidth) {
      el.parentElement.scrollTo({ left: Math.max(0, el.offsetLeft - 8), behavior: reduceMotion() ? "auto" : "smooth" });
    }
  }, [tab]);

  const onTabKey = e => {
    const keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
    if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    let n = idx;
    if (e.key === "ArrowRight") n = (idx + 1) % PANEL_TABS.length;
    if (e.key === "ArrowLeft") n = (idx - 1 + PANEL_TABS.length) % PANEL_TABS.length;
    if (e.key === "Home") n = 0;
    if (e.key === "End") n = PANEL_TABS.length - 1;
    setTab(PANEL_TABS[n].id);
    const el = tabRefs.current[PANEL_TABS[n].id];
    if (el) el.focus();
  };
  const goNext = () => {
    setTab(next.id);
    if (navRef.current) navRef.current.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
    const el = tabRefs.current[next.id];
    if (el) el.focus({ preventScroll: true });
  };
  const p = COPY.panel;
  return html`<section className="section panel-band" id="ornek-panel" aria-labelledby="panel-h">
    <div className="wrap">
      <div className="section-head" style=${{ maxWidth: "860px" }}>
        <h2 id="panel-h">${p.title}</h2>
        <p>${p.desc}</p>
        <div className="panel-labels"><span className="demo-chip">${p.label}</span><p>${p.note}</p></div>
      </div>
      <div className="panel">
        <div className="report-nav" ref=${navRef}>
          <div className="report-nav-head">
            <strong>${PANEL_TABS.length} rapor · aynı veri modeli</strong>
            <span>Raporlar arasında geçmek için bir karta tıklayın.</span>
          </div>
          <div className="tabs" role="tablist" aria-label="Raporlar">
            ${PANEL_TABS.map((t, i) => html`<button key=${t.id} id=${"tab-" + t.id} ref=${el => (tabRefs.current[t.id] = el)} role="tab" type="button" className="tab"
              aria-selected=${tab === t.id} aria-controls="tp-panel" tabIndex=${tab === t.id ? 0 : -1}
              onClick=${() => setTab(t.id)} onKeyDown=${onTabKey}>
              <span className="tab-num" aria-hidden="true">${i + 1} / ${PANEL_TABS.length}</span>
              <span className="tab-title">${t.label}</span>
              <span className="tab-sub">${t.sub}</span>
            </button>`)}
          </div>
        </div>
        <div className="filters" aria-label="Filtreler">
          <${FilterGroup} id="flt-donem" label="Dönem" options=${DIM.periods} value=${f.period} onChange=${set("period")} />
          <${FilterGroup} id="flt-sube" label="Şube" options=${ALL_BRANCH} value=${f.branch} onChange=${set("branch")} />
          ${tab === "satis"
            ? html`<${FilterGroup} id="flt-tedavi" label="Tedavi grubu" options=${ALL_TR} value=${f.treatment} onChange=${set("treatment")} />`
            : html`<${FilterGroup} id="flt-brans" label="Branş" options=${ALL_SPEC} value=${f.specialty} onChange=${set("specialty")} />`}
        </div>
        <div className="tabpanel" id="tp-panel" role="tabpanel" aria-labelledby=${"tab-" + tab}>
          ${tab === "talep" ? html`<${TabTalep} f=${f} set=${set} />` : null}
          ${tab === "mecra" ? html`<${TabMecra} f=${f} />` : null}
          ${tab === "tedavi" ? html`<${TabTedavi} f=${f} />` : null}
          ${tab === "kapasite" ? html`<${TabKapasite} f=${f} />` : null}
          ${tab === "satis" ? html`<${TabSatis} f=${f} set=${set} prim=${prim} setPrim=${setPrim} />` : null}
          <div className="report-next">
            <span className="muted">Rapor ${idx + 1} / ${PANEL_TABS.length}</span>
            <button type="button" className="btn btn-ghost btn-sm" onClick=${goNext}>${idx === PANEL_TABS.length - 1 ? "İlk rapora dön" : "Sonraki rapor"}: ${next.label} <span aria-hidden="true">→</span></button>
          </div>
          <${Notes} n=${NOTES[tab]} />
        </div>
      </div>
    </div>
  </section>`;
}

function MeetingModal({ onClose }) {
  const closeRef = useRef(null);
  const boxRef = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    if (closeRef.current) closeRef.current.focus();
    const onKey = e => {
      if (e.key === "Escape") onClose();
      if (e.key === "Tab" && boxRef.current) {
        const els = boxRef.current.querySelectorAll("button, a[href]");
        if (!els.length) return;
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); if (prev && prev.focus) prev.focus(); };
  }, []);
  const c = COPY.modal;
  return html`<div className="overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h" ref=${boxRef}>
      <h2 id="modal-h">${c.title}</h2>
      <p className="lead">${c.lead}</p>
      <ul>${c.items.map(i => html`<li key=${i}>${i}</li>`)}</ul>
      <p className="muted" style=${{ marginTop: "14px", fontSize: ".93rem" }}>${c.privacy}</p>
      <div className="status" role="status"><strong>${c.noLink}</strong></div>
      <div className="modal-actions"><button type="button" className="btn btn-ghost" ref=${closeRef} onClick=${onClose}>Kapat</button></div>
    </div>
  </div>`;
}
